<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17263d" />
    <title>Sinf daftari — haftalik reyting</title>
    <style>
:root {
  --ink: #17263d;
  --ink-2: #2c4161;
  --paper: #f3f6fb;
  --white: #fff;
  --line: #dce4ef;
  --muted: #66768b;
  --teal: #3e5fe8;
  --teal-pale: #e8ecff;
  --sun: #ddf36a;
  --sun-pale: #f5f9d9;
  --coral: #d95d4f;
  --coral-pale: #fff0ec;
  --blue-pale: #e8eff8;
  --shadow: 0 10px 24px rgba(23, 38, 61, 0.055);
  --radius: 13px;
}
* {
  box-sizing: border-box;
}
html {
  background: var(--paper);
}
body {
  margin: 0;
  color: var(--ink);
  font-family:
    Aptos,
    ui-sans-serif,
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(8, 126, 131, 0.38);
  outline-offset: 2px;
}
a {
  color: inherit;
}
.shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 246px minmax(0, 1fr);
}
.rail {
  background: var(--ink);
  color: #eef6fb;
  padding: 25px 17px 22px;
  display: flex;
  flex-direction: column;
  gap: 27px;
  min-height: 100vh;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 3px 10px;
}
.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--sun);
  color: var(--ink);
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 900;
  box-shadow: inset 0 -4px 0 rgba(135, 91, 0, 0.14);
}
.brand strong {
  display: block;
  font-size: 15px;
  letter-spacing: -0.3px;
}
.brand small {
  display: block;
  color: #b7cbda;
  margin-top: 1px;
  font-size: 11px;
}
.rail-nav {
  display: grid;
  gap: 6px;
}
.nav-label {
  font-size: 10px;
  color: #9db5c8;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 0 12px;
  margin: 0 0 6px;
}
.nav-btn {
  border: 0;
  background: transparent;
  color: #d6e4ed;
  text-align: left;
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 550;
  transition:
    background 0.16s,
    color 0.16s;
}
.nav-btn:hover {
  background: rgba(255, 255, 255, 0.09);
  color: #fff;
}
.nav-btn.active {
  background: #2e5478;
  color: #fff;
  box-shadow: inset 3px 0 var(--sun);
}
.nav-icon {
  width: 19px;
  text-align: center;
  font-size: 16px;
  opacity: 0.95;
}
.rail-note {
  margin-top: auto;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 13px;
  padding: 13px;
  color: #d1e0ea;
  font-size: 11px;
  line-height: 1.55;
}
.rail-note b {
  color: #fff;
  display: block;
  margin-bottom: 4px;
}
.rail-foot {
  font-size: 10px;
  color: #9db5c8;
  padding: 0 11px;
}
.workspace {
  min-width: 0;
}
.topbar {
  height: 73px;
  background: rgba(255, 255, 255, 0.9);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(20px, 4vw, 52px);
  position: sticky;
  top: 0;
  z-index: 4;
  backdrop-filter: blur(12px);
}
.topbar h1 {
  font-size: 16px;
  letter-spacing: -0.2px;
  margin: 0;
}
.topbar p {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 11px;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 13px;
}
.user-chip {
  display: flex;
  align-items: center;
  gap: 9px;
}
.avatar {
  width: 33px;
  height: 33px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--teal-pale);
  color: var(--teal);
  font-weight: 800;
}
.user-chip strong {
  display: block;
  font-size: 12px;
}
.user-chip small {
  display: block;
  color: var(--muted);
  font-size: 10px;
}
.main {
  max-width: 1440px;
  margin: auto;
  padding: 30px clamp(18px, 4vw, 52px) 55px;
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 23px;
}
.page-head h2 {
  font-size: 26px;
  line-height: 1.16;
  letter-spacing: -0.8px;
  margin: 0;
}
.page-head p {
  color: var(--muted);
  margin: 7px 0 0;
  max-width: 630px;
}
.page-actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}
.grid {
  display: grid;
  gap: 16px;
}
.grid-4 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.grid-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  min-width: 0;
}
.card-pad {
  padding: 20px;
}
.stat {
  padding: 18px 19px;
  min-height: 118px;
  position: relative;
  overflow: hidden;
}
.stat:after {
  content: "";
  width: 62px;
  height: 62px;
  border-radius: 50%;
  position: absolute;
  right: -15px;
  top: -21px;
  background: var(--tone, var(--blue-pale));
  opacity: 0.75;
}
.stat-label {
  color: var(--muted);
  font-size: 12px;
}
.stat-value {
  font-weight: 800;
  font-size: 29px;
  letter-spacing: -1px;
  margin-top: 7px;
  line-height: 1.1;
}
.stat-note {
  font-size: 11px;
  color: var(--muted);
  margin-top: 7px;
}
.stat-icon {
  position: absolute;
  right: 17px;
  bottom: 15px;
  font-size: 18px;
  color: var(--tone-ink, var(--ink-2));
  z-index: 1;
}
.section-title {
  font-weight: 750;
  font-size: 15px;
  margin: 0;
}
.section-sub {
  font-size: 11px;
  color: var(--muted);
  margin: 4px 0 0;
}
.card-head {
  padding: 17px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.card-body {
  padding: 19px 20px;
}
.table-wrap {
  overflow: auto;
}
.table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  white-space: nowrap;
}
.table th {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.65px;
  color: #718599;
  font-weight: 700;
  padding: 11px 14px;
  background: #f7fafb;
  border-bottom: 1px solid var(--line);
}
.table td {
  padding: 12px 14px;
  border-bottom: 1px solid #edf2f4;
  vertical-align: middle;
}
.table tbody tr:last-child td {
  border-bottom: 0;
}
.table tbody tr:hover {
  background: #f9fbfc;
}
.name-cell {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 650;
}
.mini-avatar {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  background: #e7eef5;
  color: var(--ink);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 800;
  flex: none;
}
.rank-badge {
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: #edf2f5;
  color: #597189;
  font-weight: 800;
}
.rank-1 {
  background: var(--sun-pale);
  color: #8f670c;
}
.rank-2 {
  background: #edf0f4;
  color: #53667a;
}
.rank-3 {
  background: #f8e9df;
  color: #9a5c38;
}
.score {
  font-weight: 800;
  color: var(--ink);
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  padding: 4px 9px;
  font-size: 10px;
  font-weight: 750;
  white-space: nowrap;
}
.pill::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.pill-present {
  color: #137361;
  background: #e4f5ef;
}
.pill-excused {
  color: #8a6810;
  background: #fff4d6;
}
.pill-unexcused {
  color: #b34036;
  background: #fff0ec;
}
.pill-neutral {
  color: #587087;
  background: #edf2f5;
}
.change-up {
  color: #137361;
  font-weight: 750;
}
.change-down {
  color: #b34036;
  font-weight: 750;
}
.change-same {
  color: #64798c;
  font-weight: 700;
}
.btn {
  border: 1px solid transparent;
  background: var(--ink);
  color: #fff;
  border-radius: 9px;
  padding: 9px 13px;
  font-weight: 700;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition:
    transform 0.12s,
    background 0.12s;
}
.btn:hover {
  background: #234a70;
  transform: translateY(-1px);
}
.btn:active {
  transform: translateY(0);
}
.btn-sm {
  padding: 6px 9px;
  font-size: 11px;
}
.btn-light {
  background: #fff;
  color: var(--ink);
  border-color: var(--line);
}
.btn-light:hover {
  background: #f3f7f9;
}
.btn-teal {
  background: var(--teal);
}
.btn-teal:hover {
  background: #05696e;
}
.btn-warn {
  background: #fff;
  color: var(--coral);
  border-color: #f0d3ce;
}
.btn-warn:hover {
  background: var(--coral-pale);
}
.btn-sun {
  background: var(--sun);
  color: var(--ink);
}
.btn-sun:hover {
  background: #e7ad31;
}
.icon-btn {
  width: 31px;
  height: 31px;
  padding: 0;
  border-radius: 8px;
}
.field {
  display: grid;
  gap: 6px;
}
.field label {
  font-size: 11px;
  color: #536a80;
  font-weight: 700;
}
.field input,
.field select,
.field textarea,
.table-input {
  border: 1px solid #d6e1e6;
  background: #fff;
  border-radius: 8px;
  padding: 9px 10px;
  color: var(--ink);
  min-width: 0;
}
.field input:disabled,
.field select:disabled {
  background: #f1f5f7;
  color: #80909d;
}
.field textarea {
  min-height: 84px;
  resize: vertical;
}
.field .help {
  font-size: 10px;
  color: var(--muted);
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 13px;
}
.form-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 15px;
}
.inline-form {
  display: flex;
  align-items: end;
  gap: 10px;
  flex-wrap: wrap;
}
.inline-form .field {
  min-width: 150px;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.filter-row {
  display: flex;
  align-items: end;
  gap: 10px;
  flex-wrap: wrap;
}
.empty {
  padding: 35px 20px;
  text-align: center;
  color: var(--muted);
}
.empty-mark {
  width: 43px;
  height: 43px;
  border-radius: 14px;
  background: var(--blue-pale);
  display: grid;
  place-items: center;
  margin: 0 auto 11px;
  font-size: 20px;
}
.empty strong {
  color: var(--ink);
  display: block;
  margin-bottom: 4px;
}
.banner {
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 17px;
  font-size: 12px;
}
.banner-warn {
  background: var(--sun-pale);
  color: #72540d;
  border: 1px solid #f0dfae;
}
.banner-info {
  background: #eaf3f8;
  color: #345974;
  border: 1px solid #d6e5ed;
}
.banner strong {
  display: block;
  color: inherit;
  margin-bottom: 2px;
}
.banner span {
  font-size: 15px;
}
.split {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.8fr);
  gap: 16px;
}
.quick-list {
  display: grid;
  gap: 9px;
}
.quick-link {
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-decoration: none;
}
.quick-link:hover {
  background: #f7fafb;
}
.quick-link b {
  font-size: 12px;
}
.quick-link small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 2px;
}
.quick-icon {
  background: var(--teal-pale);
  color: var(--teal);
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 16px;
}
.progress {
  height: 7px;
  border-radius: 8px;
  background: #eaf0f3;
  overflow: hidden;
}
.progress span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--teal);
}
.progress-row {
  display: grid;
  grid-template-columns: 105px 1fr 38px;
  gap: 10px;
  align-items: center;
  font-size: 11px;
  margin: 12px 0;
}
.progress-row b {
  text-align: right;
}
.subject-group {
  border-bottom: 1px solid var(--line);
  padding: 13px 0;
}
.subject-group:first-child {
  padding-top: 0;
}
.subject-group:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}
.subject-group h4 {
  margin: 0 0 8px;
  font-size: 12px;
}
.grade-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 8px;
  border-radius: 8px;
  background: #f2f6f8;
  margin: 0 6px 6px 0;
  font-size: 10px;
}
.grade-chip strong {
  font-size: 12px;
  color: var(--teal);
}
.grade-low {
  color: var(--coral) !important;
}
.callout {
  border-radius: 12px;
  background: var(--ink);
  color: #f3f8fc;
  padding: 17px 18px;
  position: relative;
  overflow: hidden;
}
.callout:after {
  content: "";
  position: absolute;
  width: 110px;
  height: 110px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  right: -20px;
  bottom: -58px;
  box-shadow:
    0 0 0 14px rgba(255, 255, 255, 0.04),
    0 0 0 30px rgba(255, 255, 255, 0.03);
}
.callout small {
  color: #bdcfdb;
  font-size: 10px;
}
.callout .big {
  font-size: 32px;
  font-weight: 850;
  letter-spacing: -1px;
  line-height: 1.2;
  margin: 6px 0;
}
.callout p {
  font-size: 11px;
  color: #d6e3eb;
  margin: 4px 0 0;
  max-width: 270px;
}
.week-strip {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
}
.week-strip strong {
  color: var(--ink);
}
.toggle {
  position: relative;
  width: 38px;
  height: 22px;
  display: inline-block;
  flex: none;
}
.toggle input {
  opacity: 0;
  width: 0;
  height: 0;
}
.toggle span {
  position: absolute;
  inset: 0;
  border-radius: 99px;
  background: #c8d4dc;
  transition: 0.2s;
}
.toggle span:before {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  left: 3px;
  top: 3px;
  border-radius: 50%;
  background: #fff;
  transition: 0.2s;
  box-shadow: 0 1px 4px #789;
}
.toggle input:checked + span {
  background: var(--teal);
}
.toggle input:checked + span:before {
  transform: translateX(16px);
}
.settings-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 13px 0;
  border-bottom: 1px solid #edf2f4;
}
.settings-row:last-child {
  border-bottom: 0;
}
.settings-row b {
  font-size: 12px;
}
.settings-row small {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
}
.login-page {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(320px, 0.88fr) minmax(400px, 1.12fr);
  background: #edf4f6;
}
.login-side {
  padding: clamp(28px, 6vw, 78px);
  background: var(--ink);
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.login-side:after {
  content: "";
  position: absolute;
  width: 460px;
  height: 460px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 50%;
  right: -180px;
  bottom: -180px;
  box-shadow:
    0 0 0 28px rgba(255, 255, 255, 0.035),
    0 0 0 58px rgba(255, 255, 255, 0.025);
}
.login-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  z-index: 1;
}
.login-brand .brand-mark {
  width: 44px;
  height: 44px;
  font-size: 23px;
}
.login-hero {
  position: relative;
  z-index: 1;
  max-width: 470px;
  margin: 45px 0;
}
.login-hero h1 {
  font-size: clamp(36px, 5vw, 62px);
  line-height: 1.02;
  letter-spacing: -2.7px;
  margin: 0 0 16px;
}
.login-hero p {
  color: #bed0dd;
  font-size: 15px;
  max-width: 380px;
  margin: 0;
}
.hero-lines {
  display: flex;
  gap: 7px;
  margin-top: 29px;
}
.hero-lines i {
  display: block;
  height: 5px;
  width: 36px;
  background: var(--sun);
  border-radius: 9px;
}
.hero-lines i:nth-child(2) {
  background: #58c3bb;
  width: 22px;
}
.hero-lines i:nth-child(3) {
  background: #82a9cc;
  width: 13px;
}
.login-foot {
  font-size: 11px;
  color: #9db5c8;
  position: relative;
  z-index: 1;
}
.login-panel {
  display: grid;
  place-items: center;
  padding: 28px;
}
.login-card {
  width: min(100%, 410px);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 19px;
  padding: 30px;
  box-shadow: 0 18px 48px rgba(23, 54, 93, 0.1);
}
.login-card h2 {
  margin: 0;
  font-size: 24px;
  letter-spacing: -0.7px;
}
.login-card > p {
  color: var(--muted);
  font-size: 12px;
  margin: 6px 0 23px;
}
.registration-card h2 {
  margin-bottom: 7px;
}
.registration-card > p {
  margin: 0 0 18px;
}
.registration-card .btn {
  width: 100%;
}
.login-card form {
  display: grid;
  gap: 14px;
}
.login-card .field label {
  color: var(--ink);
  font-size: 12px;
}
.login-card .field input {
  border: 2px solid #9aafbd;
  min-height: 44px;
}
.registration-card .field select {
  border: 2px solid #8098a9;
  background-color: #f4f8fa;
  min-height: 44px;
  color: var(--ink);
}
.registration-card .field select:focus {
  border-color: var(--teal);
}
.password-input-wrap {
  display: flex;
  align-items: stretch;
  gap: 7px;
}
.password-input-wrap input {
  flex: 1;
  width: 0;
}
.password-toggle {
  flex: 0 0 auto;
  border: 1px solid #8098a9;
  border-radius: 8px;
  background: #f4f8fa;
  color: var(--ink);
  padding: 0 10px;
  font-size: 11px;
  font-weight: 700;
}
.password-toggle:hover {
  background: var(--teal-pale);
  border-color: var(--teal);
}
.login-card .field input::placeholder {
  color: #718596;
  opacity: 1;
}
.login-hint {
  color: #294c73;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.4;
}
.login-card .field input:focus {
  border-color: var(--teal);
}
.login-card .btn {
  width: 100%;
  margin-top: 4px;
  padding: 11px;
}
.login-register {
  margin: 0;
  color: #294c73;
  font-size: 14px;
  text-align: center;
}
.login-register a {
  display: inline-block;
  border: 2px solid var(--teal);
  border-radius: 7px;
  padding: 6px 12px;
  color: var(--teal);
  font-weight: 700;
  text-decoration: none;
}
.login-register a:hover {
  background: var(--teal-pale);
}
.login-tip {
  border-top: 1px solid var(--line);
  margin-top: 19px;
  padding-top: 15px;
  color: var(--muted);
  font-size: 10px;
}
.login-tip b {
  color: var(--ink);
}
.login-side:before {
  content: "";
  position: absolute;
  width: 360px;
  height: 360px;
  left: -155px;
  top: 18%;
  border-radius: 46% 54% 62% 38%;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: radial-gradient(circle at 65% 38%, rgba(88, 195, 187, 0.18), transparent 66%);
  animation: login-shapes 42s ease-in-out infinite alternate;
  pointer-events: none;
}
.login-side:after {
  animation: login-orbit 54s ease-in-out infinite alternate;
}
.login-hero h1 {
  animation: login-title-in 1.4s ease-out both;
}
.text-link {
  justify-self: center;
  border: 0;
  padding: 3px 6px;
  color: var(--teal);
  background: transparent;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  text-decoration: underline;
}
.text-link:hover {
  color: var(--ink);
}
.assignment-list {
  display: grid;
  gap: 12px;
}
.class-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
  gap: 10px;
  padding: 14px;
}
.class-card {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  background: #fff;
}
.class-card-open {
  width: 100%;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--ink);
  text-align: left;
  display: grid;
  gap: 6px;
  cursor: pointer;
}
.class-card-open b {
  font-size: 17px;
}
.class-card-open span {
  color: var(--muted);
  font-size: 11px;
}
.class-card-actions {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}
.class-tabs {
  display: flex;
  gap: 8px;
  margin: 0 0 14px;
  border-bottom: 1px solid var(--line);
}
.class-tabs button {
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  padding: 10px 12px;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  font-weight: 700;
}
.class-tabs button.active {
  color: var(--teal);
  border-bottom-color: var(--teal);
}
.student-unstyled {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.assignment-row {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  background: #fbfdfe;
}
.assignment-classes {
  display: grid;
  gap: 8px;
  max-height: 210px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px;
}
.assignment-grade {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 13px;
  align-items: center;
  font-size: 12px;
}
.assignment-grade > b {
  min-width: 65px;
  color: var(--ink);
}
.assignment-grade label {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}
.password-dialog {
  width: min(420px, calc(100vw - 30px));
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 25px;
  color: var(--ink);
  box-shadow: 0 20px 70px rgba(14, 33, 50, 0.28);
}
.password-dialog::backdrop {
  background: rgba(16, 35, 52, 0.48);
}
.password-dialog h2 {
  margin: 0;
  font-size: 20px;
}
.temporary-password {
  padding: 13px;
  border-radius: 9px;
  background: #edf5f6;
  color: var(--ink);
  font: 700 17px ui-monospace, monospace;
  overflow-wrap: anywhere;
}
@keyframes login-shapes {
  from { transform: translate3d(-10px, 8px, 0) rotate(-8deg) scale(0.96); }
  to { transform: translate3d(24px, -16px, 0) rotate(12deg) scale(1.06); }
}
@keyframes login-orbit {
  from { transform: translate3d(0, 0, 0) rotate(0deg); }
  to { transform: translate3d(-18px, -12px, 0) rotate(16deg); }
}
@keyframes login-title-in {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .login-side:before,
  .login-side:after,
  .login-hero h1 {
    animation: none;
  }
}


.toast {
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px 14px 8px 14px;
  background: #202f4a;
}

.note-box {
  border-left: 3px solid #bcc8ff;
  border-radius: 4px 10px 6px 10px;
  background: #f2f4fc;
}

@media (max-width: 700px) {
  .main {
    min-height: calc(100vh - 62px);
    background-size: 100% 30px;
  }

  .page-head {
    padding: 16px;
    border-radius: 6px 14px 6px 14px;
  }

  .page-head::after {
    top: -54px;
    right: -46px;
    opacity: 0.55;
  }

  .page-head .page-actions {
    margin-top: 14px;
  }

  .login-card #login-form::before {
    font-size: 25px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .login-hero h1 {
    animation: none;
  }
}


.toast {
  position: fixed;
  right: 22px;
  bottom: 20px;
  z-index: 20;

}
.hidden {

}
.muted {

}
.small {
  font-size: 11px;
}
.mono {
  font-variant-numeric: tabular-nums;
}
.danger-text {

}
.note-box {
  padding: 12px 13px;
  background: #f3f7f9;
  border-radius: 10px;
  color: #526c83;
  font-size: 11px;

}
.week-select {
  min-width: 175px;
}
.footer-note {
  text-align: center;
  color: #8799a8;
  font-size: 10px;
  margin-top: 35px;
}
@media (max-width: 1020px) {

  }

}
@media (max-width: 700px) {

  .grid-4 {

  .stat {

/* A fresh, notebook-inspired visual identity for the classroom journal. */
html,
body {
  background: var(--paper);
}

body {
  color: var(--ink);
  font-family: Aptos, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  font-size: 14px;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline-color: rgba(62, 95, 232, 0.42);
}

.shell {
  background: var(--paper);
}

.rail {
  background: linear-gradient(160deg, #192a47 0%, #263f65 100%);
  border-right: 4px solid rgba(221, 243, 106, 0.72);
  gap: 24px;
}

.brand-mark {
  background: var(--sun);
  color: var(--ink);
  border-radius: 9px 13px 7px 13px;
  box-shadow: inset 0 -3px 0 rgba(23, 38, 61, 0.12);
}

.nav-label {
  color: #bdcce0;
  font-size: 11px;
  letter-spacing: 0.2px;
  text-transform: none;
}

.nav-btn {
  border-left: 3px solid transparent;
  border-radius: 7px 12px 7px 12px;
  padding: 10px 11px;
}

.nav-btn.active {
  background: var(--sun);
  border-left-color: var(--sun);
  color: #1c2b43;
  box-shadow: 0 4px 13px rgba(10, 20, 35, 0.16);
  font-weight: 750;
}

.nav-btn.active .nav-icon {
  color: #334a13;
}

.rail-note {
  border-color: rgba(255, 255, 255, 0.2);
  border-radius: 8px 14px 8px 14px;
  background: rgba(255, 255, 255, 0.035);
}

.workspace {
  min-width: 0;
  background: var(--paper);
}

.topbar {
  background: rgba(255, 255, 255, 0.96);
  border-color: var(--line);
  box-shadow: 0 4px 16px rgba(23, 38, 61, 0.035);
}

.topbar h1 {
  font-size: 17px;
  letter-spacing: -0.35px;
}

.avatar {
  border-radius: 9px 12px 8px 12px;
}

.main {
  min-height: calc(100vh - 73px);
  background-image: linear-gradient(
    to bottom,
    rgba(62, 95, 232, 0.035) 1px,
    transparent 1px
  );
  background-size: 100% 34px;
  background-position: 0 12px;
}

.page-head {
  position: relative;
  overflow: hidden;
  align-items: center;
  padding: 19px 21px;
  margin-bottom: 19px;
  border: 1px solid #dce3ff;
  border-left: 5px solid var(--teal);
  border-radius: 7px 17px 7px 17px;
  background: #e9edff;
}

.page-head::after {
  content: "";
  position: absolute;
  top: -42px;
  right: -12px;
  width: 118px;
  height: 118px;
  border: 17px solid rgba(221, 243, 106, 0.72);
  border-radius: 50%;
  pointer-events: none;
}

.page-head > div,
.page-head .page-actions {
  position: relative;
  z-index: 1;
}

.page-head h2 {
  font-size: 27px;
  letter-spacing: -0.9px;
}

.page-head p {
  color: #536482;
}

.page-actions {
  gap: 8px;
}

.grid {
  gap: 14px;
}

.card {
  border-color: var(--line);
  border-radius: 11px 15px 6px 11px;
  box-shadow: none;
}

.stat {
  border-top: 3px solid var(--tone-ink, var(--teal));
  border-radius: 8px 15px 6px 11px;
}

.stat-value {
  font-size: 31px;
  letter-spacing: -1.2px;
  font-variant-numeric: tabular-nums;
}

.card-head {
  background: rgba(248, 250, 255, 0.86);
}

.section-title {
  letter-spacing: -0.25px;
}

.table th {
  color: #5c6d87;
  background: #f1f4fb;
  font-size: 11px;
  letter-spacing: 0;
  text-transform: none;
}

.table td {
  border-bottom-color: #edf1f7;
}

.table tbody tr:hover {
  background: #f5f7ff;
}

.mini-avatar {
  border-radius: 8px 11px 7px 11px;
  background: #e9edff;
  color: #354fb8;
}

.btn {
  border-radius: 7px 11px 7px 11px;
  background: var(--teal);
  box-shadow: 0 2px 0 rgba(23, 38, 61, 0.12);
  transition: transform 0.14s ease, background-color 0.14s ease, box-shadow 0.14s ease;
}

.btn:hover {
  background: #2f4fd5;
  box-shadow: 0 4px 9px rgba(49, 78, 194, 0.17);
  transform: translateY(-1px);
}

.btn:active {
  box-shadow: none;
}

.btn-light {
  background: #fff;
  box-shadow: none;
}

.btn-light:hover {
  color: #2e4fcf;
  background: #f4f6ff;
  border-color: #ccd5fb;
  box-shadow: none;
}

.btn-teal {
  background: var(--teal);
}

.btn-sun {
  color: var(--ink);
  background: var(--sun);
  box-shadow: 0 2px 0 rgba(23, 38, 61, 0.12);
}

.btn-sun:hover {
  color: var(--ink);
  background: #c9e04e;
  box-shadow: 0 4px 9px rgba(93, 115, 24, 0.17);
}

.btn-warn {
  color: var(--coral);
  background: #fff;
  box-shadow: none;
}

.btn-warn:hover {
  color: #b74338;
  background: var(--coral-pale);
  box-shadow: none;
}

.field input,
.field select,
.field textarea,
.table-input {
  border-color: #cfd9e8;
  border-radius: 7px 10px 7px 10px;
}

.field input:focus,
.field select:focus,
.field textarea:focus,
.table-input:focus {
  border-color: var(--teal);
  outline: 3px solid rgba(62, 95, 232, 0.16);
}

.quick-link {
  border-radius: 8px 13px 7px 11px;
  transition: background-color 0.14s ease, border-color 0.14s ease;
}

.quick-link:hover {
  border-color: #cbd5fb;
  background: #f5f7ff;
}

.quick-icon {
  border-radius: 8px 12px 7px 11px;
  background: var(--teal-pale);
  color: var(--teal);
}

.progress {
  background: #e7ebf4;
}

.callout {
  border-radius: 8px 16px 8px 16px;
  background: #202f4a;
}

.login-page {
  background: var(--paper);
}

.login-side {
  background: linear-gradient(150deg, #192a47 0%, #243e65 100%);
}

.login-side::before {
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: 0;
  background:
    linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
  background-size: 30px 30px;
  animation: none;
}

.login-side::after {
  border-color: rgba(255, 255, 255, 0.16);
  box-shadow:
    0 0 0 28px rgba(255, 255, 255, 0.035),
    0 0 0 58px rgba(255, 255, 255, 0.025);
  animation: none;
}

.login-brand .brand-mark {
  border-radius: 10px 15px 8px 15px;
}

.login-hero h1 {
  max-width: 440px;
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 500;
  letter-spacing: -2.1px;
}

.hero-lines {
  align-items: center;
  gap: 6px;
}

.hero-lines i {
  height: 6px;
  border-radius: 2px 7px 2px 7px;
  background: var(--sun);
}

.hero-lines i:nth-child(2) {
  background: #78d8cb;
}

.hero-lines i:nth-child(3) {
  background: #9fb2ff;
}

.login-panel {
  position: relative;
}

.login-card {
  border: 1px solid #dce4ef;
  border-top: 4px solid var(--sun);
  border-radius: 8px 19px 8px 19px;
  box-shadow: 0 16px 42px rgba(23, 38, 61, 0.1);
}

.login-card #login-form::before {
  content: "Xush kelibsiz";
  display: block;
  margin-bottom: 2px;
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 27px;
  font-weight: 600;
  letter-spacing: -0.7px;
  line-height: 1.15;
}

.login-card .field label {
  color: #31415d;
}

.login-card .field input {
  border: 1px solid #cbd5e4;
  border-radius: 7px 10px 7px 10px;
}

.login-card .field input:focus {
  border-color: var(--teal);
}

.password-toggle {
  border-color: #cbd5e4;
  border-radius: 7px 10px 7px 10px;
  background: #f4f6fb;
}

.password-toggle:hover {
  color: #2e4fcf;
  border-color: #c5d0fa;
  background: #eef1ff;
}

.login-hint {
  color: #586a83;
}

.text-link {
  color: #334fc6;
}

.text-link:hover {
  color: #1f347f;
}

.login-side:before,
.login-side:after {
  animation: none;
}

/* Small moments of feedback across results and classroom views. */
.stat-icon {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border: 1px solid rgba(23, 38, 61, 0.06);
  border-radius: 50%;
  background: var(--tone, var(--blue-pale));
}

.callout::before {
  content: "✦";
  position: absolute;
  top: 15px;
  right: 19px;
  display: grid;
  width: 38px;
  height: 38px;
  place-items: center;
  border: 1px solid rgba(221, 243, 106, 0.38);
  border-radius: 11px 16px 9px 16px;
  color: var(--sun);
  font-size: 20px;
}

.progress {
  height: 9px;
  border: 1px solid rgba(23, 38, 61, 0.04);
  border-radius: 99px;
}

.progress span {
  min-width: 0;
  transition: width 0.45s cubic-bezier(0.2, 0.75, 0.25, 1);
}

.progress-row b {
  min-width: 42px;
  padding: 2px 6px;
  border-radius: 99px;
  background: #f0f3fa;
  color: #40516e;
  font-variant-numeric: tabular-nums;
}

.grade-chip {
  gap: 8px;
  padding: 5px 9px 5px 6px;
  border: 1px solid #e2e7f2;
  border-radius: 7px 12px 7px 12px;
  background: #fbfcff;
  color: #53627a;
}

.grade-chip strong {
  display: grid;
  width: 24px;
  height: 24px;
  place-items: center;
  border-radius: 7px 9px 6px 9px;
  background: var(--teal-pale);
  color: #344fce;
}

.grade-chip strong.grade-low {
  background: var(--coral-pale);
}

.class-tabs {
  width: fit-content;
  gap: 4px;
  padding: 4px;
  border: 1px solid #dfe5f4;
  border-radius: 8px 13px 8px 13px;
  background: #e9edff;
}

.class-tabs button {
  border: 0;
  border-radius: 6px 9px 6px 9px;
  padding: 8px 13px;
  transition: color 0.14s ease, background-color 0.14s ease;
}

.class-tabs button:hover {
  color: #2e4fcf;
}

.class-tabs button.active {
  border: 0;
  background: #fff;
  color: #2e4fcf;
  box-shadow: 0 2px 5px rgba(31, 52, 127, 0.1);
}

.own-row {
  background: #f6f8df;
}

.own-row td:first-child {
  border-left: 3px solid var(--sun);
  color: #354112;
  font-weight: 800;
}

.own-row td:first-child::before {
  content: "✦";
  margin-right: 6px;
  color: #879d25;
  font-size: 11px;
}

.own-row:hover {
  background: #f0f4d0 !important;
}

.class-card {
  border-radius: 8px 14px 7px 12px;
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}

.class-card:hover {
  transform: translateY(-2px);
  border-color: #c5cff8;
  box-shadow: 0 7px 18px rgba(23, 38, 61, 0.08);
}

.timetable {
  border-collapse: separate;
  border-spacing: 0 5px;
  white-space: normal;
}

.timetable thead th {
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: #6a7890;
  text-align: center;
}

.timetable thead th:first-child {
  text-align: left;
}

.timetable tbody td,
.timetable tbody th {
  border-bottom: 0;
  text-align: center;
}

.timetable tbody .day-label {
  min-width: 88px;
  border-radius: 7px 0 0 7px;
  background: #edf0fc;
  color: #33435f;
  font-size: 11px;
  text-align: left;
}

.timetable td.lesson-filled {
  min-width: 92px;
  border-left: 3px solid var(--lesson-ink, var(--teal));
  border-radius: 6px 10px 6px 10px;
  background: var(--lesson-wash, #eef1ff);
  color: #273955;
  font-weight: 700;
  white-space: nowrap;
}

.timetable td.lesson-filled .small {
  margin-top: 3px;
  color: #65748c;
  font-weight: 550;
  font-variant-numeric: tabular-nums;
}

.timetable td.lesson-empty {
  min-width: 72px;
  border-radius: 6px 9px 6px 9px;
  background: rgba(255, 255, 255, 0.55);
  color: #a0aabe;
  text-align: center;
}

.timetable td.lesson-editing {
  min-width: 145px;
  border-radius: 7px 11px 7px 11px;
  background: #f5f7fc;
  vertical-align: top;
}

.timetable tbody tr:nth-child(1) td.lesson-filled { --lesson-ink: #3e5fe8; --lesson-wash: #eef1ff; }
.timetable tbody tr:nth-child(2) td.lesson-filled { --lesson-ink: #19866d; --lesson-wash: #eaf7f2; }
.timetable tbody tr:nth-child(3) td.lesson-filled { --lesson-ink: #bf8b22; --lesson-wash: #fbf5df; }
.timetable tbody tr:nth-child(4) td.lesson-filled { --lesson-ink: #7859bd; --lesson-wash: #f2edfb; }
.timetable tbody tr:nth-child(5) td.lesson-filled { --lesson-ink: #d36a49; --lesson-wash: #fff0e9; }
.timetable tbody tr:nth-child(6) td.lesson-filled { --lesson-ink: #27849c; --lesson-wash: #e8f5f8; }

@media (max-width: 700px) {
  .class-tabs {
    width: 100%;
  }

  .class-tabs button {
    flex: 1;
  }

  .timetable {
    min-width: max-content;
  }
}

@media (prefers-reduced-motion: reduce) {
  .progress span,
  .class-tabs button,
  .class-card {
    transition: none;
  }
}

.week-journey {
  margin-top: 15px;
  overflow: hidden;
}

.week-journey .card-head {
  border-bottom: 0;
}

.journey-count {
  flex: none;
  padding: 5px 9px;
  border: 1px solid #dfe5f4;
  border-radius: 99px;
  background: #f5f7ff;
  color: #4e5f7b;
  font-size: 10px;
  font-weight: 750;
}

.week-path {
  position: relative;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 5px;
  margin: 0;
  padding: 9px 18px 20px;
  list-style: none;
}

.week-path::before {
  content: "";
  position: absolute;
  top: 24px;
  left: 10.5%;
  right: 10.5%;
  height: 2px;
  background: #e1e6f1;
}

.week-step {
  position: relative;
  z-index: 1;
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
}

.week-step-mark {
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  border: 3px solid #fff;
  border-radius: 50%;
  background: #e9edf5;
  box-shadow: 0 0 0 1px #dfe5f0;
  color: #697890;
  font-size: 13px;
  font-weight: 850;
}

.week-step-day {
  color: #34435d;
  font-size: 11px;
}

.week-step-status {
  color: #53637b;
  font-size: 10px;
  font-weight: 700;
}

.week-step small {
  min-height: 14px;
  color: #8390a3;
  font-size: 9px;
  white-space: nowrap;
}

.week-step.is-present .week-step-mark {
  background: var(--sun);
  box-shadow: 0 0 0 1px #c6db54;
  color: #354112;
}

.week-step.is-present .week-step-status {
  color: #526c20;
}

.week-step.is-excused .week-step-mark {
  background: #fff1cc;
  box-shadow: 0 0 0 1px #ecd99b;
  color: #8a6810;
}

.week-step.is-unexcused .week-step-mark {
  background: var(--coral-pale);
  box-shadow: 0 0 0 1px #f2cdc5;
  color: #b74338;
}

.week-step.is-today .week-step-mark {
  background: #eef1ff;
  box-shadow: 0 0 0 2px #8395f0;
  color: #334fc6;
}

.week-step.is-upcoming .week-step-mark,
.week-step.is-unmarked .week-step-mark {
  background: #f4f6fa;
  color: #8793a5;
}

@media (max-width: 700px) {
  .week-path {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    padding: 4px 14px 15px;
  }

  .week-path::before {
    display: none;
  }

  .week-step {
    padding: 9px 4px 8px;
    border: 1px solid #e5e9f2;
    border-radius: 8px 12px 7px 12px;
    background: #fff;
  }
}

.login-generator {
  display: flex;
  justify-content: flex-start;
}

.database-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 16px;
}

.database-count {
  padding: 17px 20px;
  color: var(--ink);
  text-align: left;
}

.database-count span {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.database-count strong {
  display: block;
  margin-top: 6px;
  font-size: 29px;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

.database-count.selected {
  border-color: #8195ef;
  background: #eef1ff;
  box-shadow: inset 0 -3px 0 var(--teal);
}

.database-search {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  min-width: 0;
}

.database-records .card-head {
  flex-wrap: wrap;
}

.database-search input {
  width: min(230px, 100%);
}

.database-pages {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 14px;
  border-top: 1px solid var(--line);
}

.database-pages button:disabled {
  cursor: default;
  opacity: 0.45;
  transform: none;
}

.rail-nav {
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: thin;
}

@media (max-width: 700px) {
  .database-summary {
    gap: 8px;
  }

  .database-count {
    padding: 13px 11px;
  }

  .database-count strong {
    font-size: 24px;
  }

  .rail-nav {
    overflow-y: hidden;
    overflow-x: auto;
  }
}

  function authContext() {

  function saveSession(context = authContext()) {
    const user = context.state.user,
      userId = user && sessionUserId(user),
      account = user && sessionAccount(context.state.db, user.role, userId);
    if (!account) {
      context.storage.removeItem(SESSION_KEY);
      return false;
    }
    const issuedAt = context.now();
    // Explicit allowlist: never serialize the user/account or any credentials.
    context.storage.setItem(SESSION_KEY, JSON.stringify({

  function readSession(context) {
    try {
      const session = JSON.parse(context.storage.getItem(SESSION_KEY)),
        fields = ["role", "userId", "sessionVersion", "issuedAt", "expiresAt"],
        now = context.now();
      if (!session || typeof session !== "object" || Array.isArray(session) ||
          Object.keys(session).length !== fields.length ||
          !fields.every((key) => Object.prototype.hasOwnProperty.call(session, key)) ||
          !["student", "teacher", "developer"].includes(session.role) ||
          typeof session.userId !== "string" || !session.userId ||
          !Number.isSafeInteger(session.sessionVersion) || session.sessionVersion < 0 ||
          !Number.isSafeInteger(session.issuedAt) || session.issuedAt < 0 || session.issuedAt > now ||
          !Number.isSafeInteger(session.expiresAt) || session.expiresAt <= now ||
          session.expiresAt - session.issuedAt !== SESSION_DURATION)

      if (!account || session.sessionVersion !== sessionVersionOf(account))
        throw new Error("Invalid session account");
      return {
        user: userFromAccount(session.role, account),
        mustChange: session.role !== "developer" && account.mustChangePassword === true,

      context.storage.removeItem(SESSION_KEY);

  function applyAuthenticatedUser(user, mustChange, context) {

      return true;

    const teacher = db.teachers.find(

    if (teacher && await passwordMatches(password, teacher.passwordHash)) {

      return true;

  // ===== Rating calculation =====
  function calculateRatings(db, start) {
    const { from, to } = dataRangeDates(start),
      w = db.settings.weights;
    const rows = db.students.filter((student) => !student.archived).map((student) => {
      const grades = db.grades
        .filter(
          (g) => g.studentId === student.id && g.date >= from && g.date <= to,
        )
        .map((g) => Number(g.value));
      const avg = grades.length
        ? grades.reduce((a, b) => a + b, 0) / grades.length
        : null;
      const days = db.attendance.filter(
        (a) => a.studentId === student.id && a.date >= from && a.date <= to,
      );
      const unexcusedDays = days.filter((a) => a.status === "unexcused").length;
      const skipped = days.reduce(
        (n, a) => n + (Number(a.skippedLessons) || 0),
        0,
      );
      // Tekshiruv misoli: 4.5*20 - 1*3 - 2*2 = 83 ball.
      const score =
        Math.round(
          ((avg ?? 0) * w.avgMultiplier -
            unexcusedDays * w.unexcusedAbsencePenalty -
            skipped * w.skippedLessonPenalty +
            Number.EPSILON) *
            100,
        ) / 100;
      return {
        studentId: student.id,
        classId: student.classId ?? null,
        fullName: student.fullName,
        avg,
        unexcusedDays,
        skipped,
        score,
      };
    });
    rows.sort(
      (a, b) =>
        b.score - a.score ||
        (b.avg ?? -Infinity) - (a.avg ?? -Infinity) ||
        a.fullName.localeCompare(b.fullName, "uz"),
    );
    return rows.map((r, i) => ({ ...r, rank: i + 1 }));
  }
  function calculateClassRatings(db, start, studentRatings = calculateRatings(db, start)) {
    const result = db.classes.map((klass) => {
        const rows = studentRatings.filter((rating) => rating.classId === klass.id),
          averageScore = rows.length
            ? rows.reduce((sum, rating) => sum + Number(rating.score), 0) / rows.length
            : null;
        return { classId: klass.id, className: klass.name, studentCount: rows.length, averageScore };
      });
    result.sort((a, b) =>
      (b.averageScore ?? -Infinity) - (a.averageScore ?? -Infinity) ||
      a.className.localeCompare(b.className, "uz"),
    );
    return result.map((row, index) => ({ ...row, rank: index + 1 }));

  function generateTimetable(
    grade,
    lessonsPerDay,
    curriculumRows,
    rng = Math.random,
  ) {
    const rows = (Array.isArray(curriculumRows) ? curriculumRows : []).filter(
        (row) => row.grade == null || Number(row.grade) === Number(grade),
      ),
      bySubject = new Map();
    for (const row of rows) {
      const subjectId = String(row.subjectId || "");
      if (!subjectId) continue;
      if (!bySubject.has(subjectId)) {
        const value = row.weeklyHours;
        bySubject.set(subjectId, {
          subjectId,
          weeklyHours: value === "" || value == null ? null : Number(value),
        });
      }
    }
    const subjects = [...bySubject.values()];
    if (!subjects.length) return { error: "Bu daraja uchun o‘quv reja yo‘q" };
    if (
      !Number.isInteger(Number(lessonsPerDay)) ||
      Number(lessonsPerDay) < 1 ||
      Number(lessonsPerDay) > 20
    )
      return { error: "Kunlik darslar soni noto‘g‘ri" };
    if (
      subjects.some(
        (subject) =>
          subject.weeklyHours !== null &&
          (!Number.isInteger(subject.weeklyHours) ||
            subject.weeklyHours < 0 ||
            subject.weeklyHours > 12),
      )
    )
      return { error: "O‘quv reja haftalik soatlari noto‘g‘ri" };
    const perDay = Number(lessonsPerDay),
      slotCount = 6 * perDay,
      known = subjects.filter((subject) => subject.weeklyHours !== null),
      unknown = subjects.filter((subject) => subject.weeklyHours === null),
      counts = new Map(
        subjects.map((subject) => [
          subject.subjectId,
          subject.weeklyHours ?? 1,
        ]),
      );
    let warning = "";
    const proportionalCounts = (weights) => {
      const sum = [...weights.values()].reduce((a, b) => a + b, 0),
        result = new Map(),
        fractions = [];
      let allocated = 0;
      for (const [subjectId, weight] of weights) {
        const exact = sum ? (weight * slotCount) / sum : 0,
          count = Math.floor(exact);
        result.set(subjectId, count);
        allocated += count;
        fractions.push({
          subjectId,
          fraction: exact - count,
          tie: Number(rng()) || 0,
        });
      }
      fractions.sort((a, b) => b.fraction - a.fraction || a.tie - b.tie);
      for (let i = 0; i < slotCount - allocated; i++)
        result.set(
          fractions[i % fractions.length].subjectId,
          result.get(fractions[i % fractions.length].subjectId) + 1,
        );
      return result;
    };
    const desiredTotal = [...counts.values()].reduce((a, b) => a + b, 0);
    if (desiredTotal > slotCount) {
      const reduced = proportionalCounts(counts);
      counts.clear();
      for (const [subjectId, count] of reduced) counts.set(subjectId, count);
      warning = "Soatlar sig‘madi, ayrim fanlar kamaytirildi";
    } else if (unknown.length) {
      let remaining = slotCount - desiredTotal;
      while (remaining > 0) {
        const lowest = Math.min(
            ...unknown.map((subject) => counts.get(subject.subjectId)),
          ),
          tied = unknown.filter(
            (subject) => counts.get(subject.subjectId) === lowest,
          ),
          chosen =
            tied[
              Math.min(
                tied.length - 1,
                Math.floor(
                  Math.max(0, Math.min(0.999999999, Number(rng()) || 0)) *
                    tied.length,
                ),
              )
            ];
        counts.set(chosen.subjectId, counts.get(chosen.subjectId) + 1);
        remaining--;
      }
    } else {
      let remaining = slotCount - desiredTotal;
      while (remaining > 0) {
        const pick = Math.min(
            subjects.length - 1,
            Math.floor(
              Math.max(0, Math.min(0.999999999, Number(rng()) || 0)) *
                subjects.length,
            ),
          ),
          subjectId = subjects[pick].subjectId;
        counts.set(subjectId, counts.get(subjectId) + 1);
        remaining--;
      }
    }
    const shuffle = (list) => {
      const result = [...list];
      for (let i = result.length - 1; i > 0; i--) {
        const value = Math.max(0, Math.min(0.999999999, Number(rng()) || 0)),
          j = Math.floor(value * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    };
    const score = (placed) => {
      const daily = new Map();
      for (const row of placed) {
        const key = `${row.weekday}|${row.subjectId}`;
        daily.set(key, (daily.get(key) || 0) + 1);
      }
      return [...daily.values()].reduce(
        (total, count) => total + Math.max(0, count - 1),
        0,
      );
    };
    let bestRows = null,
      bestRepeats = Infinity;
    for (let attempt = 0; attempt < 200; attempt++) {
      const priority = shuffle(subjects.map((subject) => subject.subjectId)),
        priorityIndex = new Map(
          priority.map((subjectId, index) => [subjectId, index]),
        ),
        remaining = new Map(counts),
        placed = [];
      for (let weekday = 1; weekday <= 6; weekday++) {
        const chosen = [];
        for (let slot = 0; slot < perDay; slot++) {
          const active = [...remaining]
            .filter(([, count]) => count > 0)
            .map(([subjectId, count]) => ({ subjectId, count }))
            .sort(
              (a, b) =>
                b.count - a.count ||
                priorityIndex.get(a.subjectId) - priorityIndex.get(b.subjectId),
            );
          if (!active.length) break;
          const distinct = active.filter(
              (entry) => !chosen.includes(entry.subjectId),
            ),
            pool = distinct.length ? distinct : active,
            topCount = pool[0].count,
            tied = pool.filter((entry) => entry.count === topCount),
            picked =
              tied[
                Math.min(
                  tied.length - 1,
                  Math.floor(
                    Math.max(0, Math.min(0.999999999, Number(rng()) || 0)) *
                      tied.length,
                  ),
                )
              ];
          chosen.push(picked.subjectId);
          remaining.set(picked.subjectId, remaining.get(picked.subjectId) - 1);
        }
        for (const subjectId of shuffle(chosen))
          placed.push({
            weekday,
            lessonNo:
              placed.filter((row) => row.weekday === weekday).length + 1,
            subjectId,
            startTime: "",
            endTime: "",
          });
      }
      const repeats = score(placed);
      if (placed.length === slotCount && repeats < bestRepeats) {
        bestRows = placed;
        bestRepeats = repeats;
        if (repeats === 0) break;
      }
    }
    if (!bestRows) return { error: "Dars jadvalini tuzib bo‘lmadi" };
    return {
      rows: bestRows,
      repeats: bestRepeats,
      warning: warning || null,
    };
  }

  async function readPlacementCSV(file) {
    if (state.user?.role !== "developer") {
      notify("O‘quvchilarni joylash faqat dasturchi uchun.");
      return;
    }
    try {
      const rows = csvParse((await file.text()).replace(/^\uFEFF/, ""));
      if (rows.length < 1) throw new Error("CSV fayli bo‘sh.");
      const headers = rows[0].map((value) => value.trim()),
        required = ["student_id", "full_name", "class", "username", "password_hash"];
      if (!required.every((header) => headers.includes(header)))
        throw new Error("Ustunlar: student_id, full_name, class, username, password_hash.");
      const column = Object.fromEntries(required.map((name) => [name, headers.indexOf(name)])),
        seenIds = new Set(),
        seenLogins = new Set(),
        fileIds = new Set(),
        valid = [],
        rejected = [];
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i],
          rowNumber = i + 1,
          externalId = String(row[column.student_id] || "").trim(),
          fullName = String(row[column.full_name] || "").trim(),
          className = String(row[column.class] || "").trim(),
          username = String(row[column.username] || "").trim(),
          passwordHash = String(row[column.password_hash] || "").trim(),
          issues = [];
        if (externalId) fileIds.add(externalId);
        if (!externalId) issues.push("student_id bo‘sh");
        else if (seenIds.has(externalId)) issues.push("student_id takrorlangan");
        else seenIds.add(externalId);
        if (!fullName) issues.push("full_name bo‘sh");
        if (className && !/^([1-9]|1[01])-[A-Z]$/.test(className))
          issues.push("class ^([1-9]|1[01])-[A-Z]$ formatida bo‘lsin");
        const login = normalizedLogin(username),
          matched = state.db.students.find((student) =>
            String(student.externalId || student.student_id || "") === externalId,
          ),
          owner = state.db.students.find((student) => normalizedLogin(student.username) === login);
        if (!username) issues.push("username bo‘sh");
        else if (seenLogins.has(login)) issues.push("username faylda takrorlangan");
        else seenLogins.add(login);
        if (username && owner && owner.id !== matched?.id)
          issues.push("username boshqa o‘quvchiga tegishli");
        if (username) {
          const error = studentLoginError(state.db, fullName, username, matched);
          if (error) issues.push(error);
        }
        if (!/^[0-9a-f]{64}$/.test(passwordHash))
          issues.push("password_hash 64 ta kichik hex belgidan iborat bo‘lsin");
        if (issues.length) rejected.push({ rowNumber, reason: issues.join("; ") });
        else valid.push({ rowNumber, externalId, fullName, className, username, passwordHash });
      }
      const existingByExternalId = new Map(
          state.db.students
            .map((student) => [String(student.externalId || student.student_id || ""), student])
            .filter(([key]) => key),
        ),
        classNames = new Set(state.db.classes.map((klass) => normalizedLogin(klass.name))),
        newClasses = [...new Set(valid.map((row) => row.className).filter(Boolean))]
          .filter((name) => !classNames.has(normalizedLogin(name)))
          .sort((a, b) => a.localeCompare(b, "uz")),
        updates = valid.filter((row) => existingByExternalId.has(row.externalId)).length,
        additions = valid.length - updates,
        withoutClass = valid.filter((row) => !row.className).length,
        missingStudents = state.db.students.filter((student) =>
          !fileIds.has(String(student.externalId || student.student_id || "")),
        ).length;
      state.placementPending = {
        fileName: file.name,
        total: rows.length - 1,
        valid,
        rejected,
        fileIds: [...fileIds],
        newClasses,
        updates,
        additions,
        withoutClass,
        missingStudents,
      };
      state.placementOptions = { mustChangePassword: true, archiveMissing: false };
      render();
    } catch (error) {
      state.placementPending = null;
      render();
      notify(`CSV fayli o‘qilmadi: ${error.message}`);
    }
  }
  function buildPlacementData(db, pending, options) {
    const staged = cloneData(db);
    for (const name of pending.newClasses) {
      const match = name.match(/^([1-9]|1[01])-([A-Z])$/);
      if (!match) throw new Error(`Sinf nomi noto‘g‘ri: ${name}`);
      if (staged.classes.some((klass) => normalizedLogin(klass.name) === normalizedLogin(name))) continue;
      staged.classes.push({
        id: id("class"),
        name,
        grade: Number(match[1]),
        section: match[2],
        teacherId: null,
      });
    }
    let added = 0,
      updated = 0;
    for (const row of pending.valid) {
      const klass = row.className
          ? staged.classes.find((item) => normalizedLogin(item.name) === normalizedLogin(row.className))
          : null,
        existing = staged.students.find((student) =>
          String(student.externalId || student.student_id || "") === row.externalId,
        ),
        values = {
          externalId: row.externalId,
          fullName: row.fullName,
          classId: klass?.id || null,
          username: row.username,
          passwordHash: row.passwordHash,
          archived: false,
        };
      if (existing) {
        Object.assign(existing, values);
        updated++;
      } else {
        staged.students.push({
          id: id("student"),
          ...values,
          mustChangePassword: options.mustChangePassword,
        });
        added++;
      }
    }
    if (options.archiveMissing) {
      const present = new Set(pending.fileIds);
      for (const student of staged.students)
        if (!present.has(String(student.externalId || student.student_id || "")))
          student.archived = true;
    }
    staged.importLog = Array.isArray(staged.importLog) ? staged.importLog : [];
    staged.importLog.push({
      date: new Date().toISOString(),
      fileName: pending.fileName,
      added,
      updated,
      rejected: pending.rejected.length,
      options: { ...options },
    });
    syncLoginRegistry(staged, db);
    return { db: staged, added, updated };
  }
  async function savePlacement() {
    const pending = state.placementPending;
    if (state.user?.role !== "developer" || !pending) return;
    try {
      const { db: staged, added, updated } = buildPlacementData(
        state.db,
        pending,
        state.placementOptions,
      );
      validateData(staged);
      await saveData(staged);
      state.db = staged;
      state.placementPending = null;
      state.view = "classes";
      render();
      notify(`${added} ta o‘quvchi qo‘shildi, ${updated} ta yangilandi.`);
    } catch (error) {
      notify(`Joylash saqlanmadi: ${error.message}`);
    }
  }
